$kind: collection
description: |-
  Colección del equipo para la API REST de ApunteIA (Lab 6).

  Cada integrante agrega su carpeta: Auth y Usuarios (Fernán), Cursos/Inscripciones/Logs (Alice), Notas (Sharon), Evaluaciones (Dayron).

  Seguridad: la colección usa Bearer {{token}} (lo guarda el login). Las rutas solo-ADMIN usan {{adminToken}}. Correr primero la carpeta 'Seguridad JWT (Fernán)'.

  Variable {{baseUrl}}: http://localhost:8080 (local o Docker). Correr en orden con el Collection Runner.
variables:
  baseUrl: http://localhost:8080
  demoEmail: demo@apunteia.com
  demoPassword: "123456"
  token: ""
  newEmail: ""
  newUserId: ""
  adminEmail: admin@apunteia.com
  adminPassword: Admin123!
  adminToken: ""
  jwtUserId: ""
  jwtTampered: ""
  jwtExpired: ""
  jwtDevSecret: dev-only-apunteia-jwt-secret-cambiar-en-produccion-0123456789
  jwtTempEmail: ""
  jwtTempToken: ""
  jwtTempUserId: ""
  aiUserId: ""
  aiCourseId: ""
  aiNoteId: ""
  demoUserId: ""
  evalUserId: ""
  evalOtherUserId: ""
  evalSeedCourseId: ""
  evalRunId: ""
  evalCourseCode: ""
  evalCourseId: ""
  evalAssessmentId: ""
  evalAttemptId: ""
  evalSecondAttemptId: ""
  genUserId: ""
  genCourseId: ""
  genNoteId: ""
  genAssessmentId: ""
  genQuizTitle: ""
auth:
  - id: fea51df4-a4d8-4908-ba7c-13a6355abfa1
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
