scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Formato comun de error', () => { pm.expect(body.status).to.eql(401); ['message', 'error', 'path', 'timestamp'].forEach(key => pm.expect(body[key]).to.be.a('string').and.not.empty); });
