$kind: http-request
url: "{{baseUrl}}/courses/{{academicCourseId}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"code":"{{academicCourseCode}}","name":"Curso Postman actualizado","description":"Descripción actualizada por Alice"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('DTO de curso', () => { pm.expect(body).to.have.all.keys('id', 'code', 'name', 'description'); pm.expect(body.id).to.be.a('number').and.above(0); pm.expect(body.code).to.be.a('string'); pm.expect(body.name).to.be.a('string'); pm.expect(body.description === null || typeof body.description === 'string').to.eql(true); });
      pm.test('Curso creado coincide con las variables', () => { pm.expect(body.id).to.eql(Number(pm.collectionVariables.get('academicCourseId'))); pm.expect(body.code).to.eql(pm.collectionVariables.get('academicCourseCode')); });
      pm.test('Nombre y descripción actualizados', () => { pm.expect(body.name).to.eql('Curso Postman actualizado'); pm.expect(body.description).to.eql('Descripción actualizada por Alice'); });
    language: text/javascript
order: 7000
