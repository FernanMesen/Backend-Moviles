$kind: http-request
url: "{{baseUrl}}/courses/{{academicCourseId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Error con formato común', () => { pm.expect(body.status).to.eql(409); pm.expect(body.message).to.be.a('string').and.not.empty; pm.expect(body.error).to.be.a('string'); pm.expect(body.path).to.be.a('string'); pm.expect(body.timestamp).to.be.a('string'); });
    language: text/javascript
order: 18000
