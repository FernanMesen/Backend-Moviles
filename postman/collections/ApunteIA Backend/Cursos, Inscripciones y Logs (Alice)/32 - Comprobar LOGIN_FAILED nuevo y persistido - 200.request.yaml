$kind: http-request
url: "{{baseUrl}}/security-logs?eventType=LOGIN_FAILED"
method: GET
headers:
  Accept: application/json
queryParams:
  eventType: LOGIN_FAILED
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Respuesta es array', () => pm.expect(body).to.be.an('array'));
      pm.test('Lista no vacia y eventos LOGIN_FAILED', () => { pm.expect(body).to.not.be.empty; body.forEach(log => pm.expect(log.eventType).to.eql('LOGIN_FAILED')); });
      pm.test('Existe fallo nuevo del demo con motivo de password incorrecto', () => { const previous = Number(pm.collectionVariables.get('academicBeforeLOGIN_FAILED')); const userId = Number(pm.collectionVariables.get('demoUserId')); const latest = body.find(log => log.userId === userId); pm.expect(latest).to.be.an('object'); pm.expect(latest.id).to.be.above(previous); pm.expect(latest.details).to.include('incorrecta'); });
    language: text/javascript
order: 32000
