$kind: http-request
url: "{{baseUrl}}/courses/{{academicCourseId}}/enrollments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"userId":{{demoUserId}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Inscripcion del curso y usuario solicitados; guardar ID', () => { pm.expect(body.userId).to.eql(Number(pm.collectionVariables.get('demoUserId'))); pm.expect(body.courseId).to.eql(Number(pm.collectionVariables.get('academicCourseId'))); pm.expect(Number.isInteger(body.id) && body.id > 0).to.eql(true); pm.collectionVariables.set('academicEnrollmentId', body.id); });
      pm.test('Location del recurso creado', () => pm.expect(pm.response.headers.get('Location')).to.match(new RegExp('/enrollments/' + body.id + '$')));
    language: text/javascript
order: 36000
