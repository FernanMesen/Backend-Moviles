$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "{{academicCourseCode}}",
      "name": "Curso Postman Alice",
      "description": "Datos temporales del issue #33"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('DTO de curso', () => { pm.expect(body).to.have.all.keys('id', 'code', 'name', 'description', 'syllabus'); pm.expect(body.id).to.be.a('number').and.above(0); pm.expect(body.code).to.be.a('string'); pm.expect(body.name).to.be.a('string'); pm.expect(body.description === null || typeof body.description === 'string').to.eql(true); });
      pm.test('Código dinámico y campos correctos; guardar ID', () => { pm.expect(body.code).to.eql(pm.collectionVariables.get('academicCourseCode')); pm.expect(body.name).to.eql('Curso Postman Alice'); pm.expect(body.description).to.eql('Datos temporales del issue #33'); pm.expect(Number.isInteger(body.id) && body.id > 0).to.eql(true); pm.collectionVariables.set('academicCourseId', body.id); });
      pm.test('Location apunta al curso creado', () => pm.expect(pm.response.headers.get('Location')).to.match(new RegExp('/courses/' + body.id + '$')));
    language: text/javascript
order: 3000
