$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"code":"{{academicCourseCode}}","name":"Curso temporal aliases Alice","description":"Cleanup al finalizar issue 33"}'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('academicCourseCode', 'ALIAS_' + pm.variables.replaceIn('{{$guid}}').replace(/-/g, ''));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Curso dinamico creado; guardar ID', () => { pm.expect(Number.isInteger(body.id) && body.id > 0).to.eql(true); pm.expect(body.code).to.eql(pm.collectionVariables.get('academicCourseCode')); pm.collectionVariables.set('academicCourseId', body.id); });
      pm.test('Location del curso', () => pm.expect(pm.response.headers.get('Location')).to.match(new RegExp('/courses/' + body.id + '$')));
    language: text/javascript
order: 35000
