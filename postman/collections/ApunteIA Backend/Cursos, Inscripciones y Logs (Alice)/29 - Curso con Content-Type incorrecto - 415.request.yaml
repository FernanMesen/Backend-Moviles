$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Accept: application/json
  Content-Type: text/plain
body:
  type: text
  content: Contenido no JSON
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 415', () => pm.response.to.have.status(415));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Error con formato común', () => { pm.expect(body.status).to.eql(415); pm.expect(body.message).to.be.a('string').and.not.empty; pm.expect(body.error).to.be.a('string'); pm.expect(body.path).to.be.a('string'); pm.expect(body.timestamp).to.be.a('string'); });
    language: text/javascript
order: 29000
