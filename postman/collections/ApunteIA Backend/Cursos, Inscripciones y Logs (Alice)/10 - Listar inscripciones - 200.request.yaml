$kind: http-request
url: "{{baseUrl}}/enrollments"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Respuesta es un array', () => pm.expect(body).to.be.an('array'));
      pm.test('La lista contiene la inscripción creada', () => pm.expect(body.some(item => item.id === Number(pm.collectionVariables.get('academicEnrollmentId')))).to.eql(true));
    language: text/javascript
order: 10000
