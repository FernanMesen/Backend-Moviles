$kind: http-request
url: "{{baseUrl}}/enrollments?userId={{demoUserId}}"
method: GET
headers:
  Accept: application/json
queryParams:
  userId: "{{demoUserId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Respuesta es un array', () => pm.expect(body).to.be.an('array'));
      pm.test('Todas pertenecen al usuario y contienen la inscripción creada', () => { pm.expect(body.length).to.be.above(0); body.forEach(item => pm.expect(item.userId).to.eql(Number(pm.collectionVariables.get('demoUserId')))); pm.expect(body.some(item => item.id === Number(pm.collectionVariables.get('academicEnrollmentId')))).to.eql(true); });
    language: text/javascript
order: 12000
