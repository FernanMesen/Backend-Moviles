$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"code":"","name":""}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Error con formato común', () => { pm.expect(body.status).to.eql(400); pm.expect(body.message).to.be.a('string').and.not.empty; pm.expect(body.error).to.be.a('string'); pm.expect(body.path).to.be.a('string'); pm.expect(body.timestamp).to.be.a('string'); });
      pm.test('Errores de validación para code y name', () => { pm.expect(body.fieldErrors.code).to.be.a('string').and.not.empty; pm.expect(body.fieldErrors.name).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 5000
