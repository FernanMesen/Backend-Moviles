$kind: http-request
url: "{{baseUrl}}/security-logs"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"eventType":"POSTMAN_TEST","details":"Debe rechazarse"}'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 405', () => pm.response.to.have.status(405));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Error con formato común', () => { pm.expect(body.status).to.eql(405); pm.expect(body.message).to.be.a('string').and.not.empty; pm.expect(body.error).to.be.a('string'); pm.expect(body.path).to.be.a('string'); pm.expect(body.timestamp).to.be.a('string'); });
    language: text/javascript
order: 28000
