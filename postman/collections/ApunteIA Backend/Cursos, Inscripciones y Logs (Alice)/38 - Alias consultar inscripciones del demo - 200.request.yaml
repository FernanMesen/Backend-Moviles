$kind: http-request
url: "{{baseUrl}}/users/{{demoUserId}}/enrollments"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Respuesta es array', () => pm.expect(body).to.be.an('array'));
      pm.test('Contiene inscripcion creada', () => pm.expect(body.some(enrollment => enrollment.id === Number(pm.collectionVariables.get('academicEnrollmentId')) && enrollment.courseId === Number(pm.collectionVariables.get('academicCourseId')))).to.eql(true));
      pm.test('Solo inscripciones del usuario solicitado', () => body.forEach(enrollment => pm.expect(enrollment.userId).to.eql(Number(pm.collectionVariables.get('demoUserId')))));
    language: text/javascript
order: 38000
