$kind: http-request
url: "{{baseUrl}}/users"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: |-
      ['demoUserId', 'academicCourseId', 'academicEnrollmentId'].forEach(key => pm.collectionVariables.unset(key));
      const unique = Date.now().toString(36) + '_' + pm.variables.replaceIn('{{$guid}}').replace(/-/g, '').slice(0, 12);
      pm.collectionVariables.set('academicCourseCode', 'POSTMAN_' + unique);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Respuesta es un array', () => pm.expect(body).to.be.an('array'));
      pm.test('Existe demo@apunteia.com con ID válido', () => { const demo = body.find(user => user.email === 'demo@apunteia.com'); pm.expect(demo, 'No existe el usuario demo@apunteia.com; revisar los datos semilla').to.be.an('object'); pm.expect(Number.isInteger(demo.id) && demo.id > 0, 'El usuario demo debe tener un ID positivo').to.eql(true); pm.collectionVariables.set('demoUserId', demo.id); });
    language: text/javascript
order: 1000
