$kind: http-request
url: "{{baseUrl}}/courses/{{academicCourseId}}/enrollments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{"userId":{{demoUserId}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('Formato comun de error', () => { pm.expect(body.status).to.eql(409); ['message', 'error', 'path', 'timestamp'].forEach(key => pm.expect(body[key]).to.be.a('string').and.not.empty); });
    language: text/javascript
order: 37000
