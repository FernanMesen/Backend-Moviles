$kind: http-request
url: "{{baseUrl}}/enrollments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": {{demoUserId}},
      "courseId": {{academicCourseId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      pm.test('DTO de inscripción sin entidades ni credenciales', () => { pm.expect(body).to.have.all.keys('id', 'userId', 'userFullName', 'userEmail', 'courseId', 'courseCode', 'courseName', 'enrolledAt'); pm.expect(body.id).to.be.a('number').and.above(0); pm.expect(body.userFullName).to.be.a('string').and.not.empty; pm.expect(body.userEmail).to.eql('demo@apunteia.com'); pm.expect(body.courseCode).to.eql(pm.collectionVariables.get('academicCourseCode')); pm.expect(body.courseName).to.eql('Curso Postman actualizado'); pm.expect(body.enrolledAt).to.be.a('string').and.not.empty; });
      pm.test('Usuario y curso correctos', () => { pm.expect(body.userId).to.eql(Number(pm.collectionVariables.get('demoUserId'))); pm.expect(body.courseId).to.eql(Number(pm.collectionVariables.get('academicCourseId'))); });
      pm.test('Guardar ID de inscripción válido', () => { pm.expect(Number.isInteger(body.id) && body.id > 0).to.eql(true); pm.collectionVariables.set('academicEnrollmentId', body.id); });
      pm.test('Location apunta a la inscripción creada', () => pm.expect(pm.response.headers.get('Location')).to.match(new RegExp('/enrollments/' + body.id + '$')));
    language: text/javascript
order: 9000
