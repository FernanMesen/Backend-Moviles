$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{ "status": "PROCESSING" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 409", () => pm.response.to.have.status(409));
      pm.test("Error de conflicto con formato común", () => { const error = pm.response.json(); pm.expect(error.status).to.eql(409); pm.expect(error).to.have.property("message"); });
    language: text/javascript
order: 10000
