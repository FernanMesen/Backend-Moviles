$kind: http-request
url: "{{baseUrl}}/notes"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Nota Postman",
      "content": "Contenido creado desde la colección de Postman.",
      "userId": {{noteUserId}},
      "courseId": {{noteCourseId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 201", () => pm.response.to.have.status(201));
      const note = pm.response.json();
      pm.test("La nota inicia en PENDING", () => pm.expect(note.processingStatus).to.eql("PENDING"));
      pm.test("Responde con Location", () => pm.expect(pm.response.headers.get("Location")).to.include("/notes/" + note.id));
      pm.collectionVariables.set("noteId", note.id);
    language: text/javascript
order: 3000
