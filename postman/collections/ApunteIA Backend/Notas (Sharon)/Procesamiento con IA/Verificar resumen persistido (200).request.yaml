$kind: http-request
url: "{{baseUrl}}/notes/{{aiNoteId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', () => pm.response.to.have.status(200));
      const note = pm.response.json();
      pm.test('Devuelve la nota procesada', () => pm.expect(String(note.id)).to.eql(String(pm.collectionVariables.get('aiNoteId'))));
      pm.test('La nota sigue en COMPLETED', () => pm.expect(note.processingStatus).to.eql('COMPLETED'));
      pm.test('El resumen quedó persistido', () => pm.expect(note.summary).to.eql(pm.collectionVariables.get('aiSummary')));
    language: text/javascript
order: 4000
