$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: '{ "status": "COMPLETED" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("El nuevo estado es COMPLETED", () => pm.expect(pm.response.json().processingStatus).to.eql("COMPLETED"));
    language: text/javascript
order: 8000
