$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve el id solicitado", () => pm.expect(String(pm.response.json().id)).to.eql(String(pm.collectionVariables.get("noteId"))));
    language: text/javascript
order: 5000
