$kind: http-request
url: "{{baseUrl}}/notes/{{noteId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 204", () => pm.response.to.have.status(204));
      pm.test("No devuelve contenido", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 11000
