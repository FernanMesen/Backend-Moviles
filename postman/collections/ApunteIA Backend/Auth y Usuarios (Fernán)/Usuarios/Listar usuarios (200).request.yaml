$kind: http-request
url: "{{baseUrl}}/users"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      pm.test("Responde en menos de 2 s", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("No expone password_hash", () => { const t = pm.response.text(); pm.expect(t).to.not.include("passwordHash"); pm.expect(t).to.not.include("password_hash"); });
      const list = pm.response.json();
      pm.test("Es una lista con los usuarios semilla", () => { pm.expect(list).to.be.an("array"); pm.expect(list.map(u => u.email)).to.include("demo@apunteia.com"); });
    language: text/javascript
order: 1000
