$kind: http-request
url: "{{baseUrl}}/users/999999"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 404", () => pm.response.to.have.status(404));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(404); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
      pm.test("Mensaje correcto", () => pm.expect(err.message).to.include("999999"));
    language: text/javascript
order: 5000
