$kind: http-request
url: "{{baseUrl}}/users/{{newUserId}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 405", () => pm.response.to.have.status(405));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(405); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
    language: text/javascript
order: 16000
