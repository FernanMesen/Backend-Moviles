$kind: http-request
url: "{{baseUrl}}/users/{{newUserId}}/status"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("Queda ACTIVE", () => pm.expect(pm.response.json().status).to.eql("ACTIVE"));
    language: text/javascript
order: 9000
