$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: text/plain
body:
  type: json
  content: hola
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 415", () => pm.response.to.have.status(415));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(415); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
    language: text/javascript
order: 9000
