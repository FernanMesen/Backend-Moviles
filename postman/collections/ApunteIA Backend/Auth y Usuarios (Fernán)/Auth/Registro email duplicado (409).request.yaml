$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Duplicado",
      "email": "{{demoEmail}}",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 409", () => pm.response.to.have.status(409));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(409); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
      pm.test("Mensaje correcto", () => pm.expect(err.message).to.include("Ya existe"));
    language: text/javascript
order: 12000
