$kind: http-request
description: Usuario demo del IdentitySeeder. Guarda el token en {{token}}.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{demoEmail}}",
      "password": "{{demoPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      pm.test("Responde en menos de 2 s", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      const body = pm.response.json();
      pm.test("Devuelve token y userName (contrato del FrontEnd)", () => { pm.expect(body.token).to.be.a("string").and.not.empty; pm.expect(body.userName).to.eql("Maya Rodríguez"); });
      pm.collectionVariables.set("token", body.token);
    language: text/javascript
order: 1000
