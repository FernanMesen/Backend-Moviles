$kind: http-request
description: "Mismo mensaje que contraseña incorrecta: no revela qué emails existen."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "noexiste@apunteia.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 401", () => pm.response.to.have.status(401));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(401); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
      pm.test("Mensaje correcto", () => pm.expect(err.message).to.include("Credenciales inválidas"));
    language: text/javascript
order: 4000
