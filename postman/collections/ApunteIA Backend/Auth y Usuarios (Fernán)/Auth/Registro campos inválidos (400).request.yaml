$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "",
      "email": "malo",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 400", () => pm.response.to.have.status(400));
      pm.test("Responde JSON", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json"));
      const err = pm.response.json();
      pm.test("Formato de error común", () => { pm.expect(err.status).to.eql(400); pm.expect(err).to.have.property("message"); pm.expect(err).to.have.property("path"); pm.expect(err).to.have.property("timestamp"); });
      pm.test("Reporta fullName, email y password", () => pm.expect(err.fieldErrors).to.have.all.keys("fullName", "email", "password"));
    language: text/javascript
order: 13000
