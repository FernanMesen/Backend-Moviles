$kind: http-request
url: "{{baseUrl}}/courses"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve la lista de cursos", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 8000
