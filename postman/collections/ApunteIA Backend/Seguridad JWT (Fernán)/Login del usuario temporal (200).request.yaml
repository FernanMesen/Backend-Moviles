$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{jwtTempEmail}}",
      "password": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("jwtTempToken", pm.response.json().token);
    language: text/javascript
order: 13000
