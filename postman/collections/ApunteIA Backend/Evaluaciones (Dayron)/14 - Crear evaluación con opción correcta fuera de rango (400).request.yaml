$kind: http-request
url: "{{baseUrl}}/courses/{{evalCourseId}}/assessments"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Evaluación inválida {{evalRunId}}",
      "questions": [
        {
          "text": "Pregunta",
          "options": ["A", "B"],
          "correctOptionIndex": 5
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 400", () => pm.response.to.have.status(400));
      pm.test("El mensaje menciona: fuera de rango", () => pm.expect(pm.response.json().message).to.include("fuera de rango"));
    language: text/javascript
order: 14000
