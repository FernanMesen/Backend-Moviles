$kind: http-request
url: "{{baseUrl}}/users"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      const users = pm.response.json();
      const demo = users.find(user => user.email === "demo@apunteia.com");
      const profe = users.find(user => user.email === "profe@apunteia.com");
      pm.test("Existen los usuarios demo y profe", () => { pm.expect(demo).to.exist; pm.expect(profe).to.exist; });
      pm.collectionVariables.set("evalUserId", demo.id);
      pm.collectionVariables.set("evalOtherUserId", profe.id);
    language: text/javascript
order: 1000
