$kind: http-request
description: "Deja listo {{token}} y el id del usuario dueño del token, que será el creador del quiz generado."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{demoEmail}}",
      "password": "{{demoPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 200", () => pm.response.to.have.status(200));
      const login = pm.response.json();
      pm.test("Devuelve un JWT", () => pm.expect(login.token).to.be.a("string").and.not.empty);
      pm.collectionVariables.set("token", login.token);
      pm.collectionVariables.set("genUserId", login.userId);
    language: text/javascript
order: 1000
