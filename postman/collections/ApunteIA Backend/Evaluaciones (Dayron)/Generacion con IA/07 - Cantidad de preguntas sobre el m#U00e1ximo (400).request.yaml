$kind: http-request
url: "{{baseUrl}}/notes/{{genNoteId}}/assessments/generate"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "questionCount": 21,
      "difficulty": "EASY"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 400", () => pm.response.to.have.status(400));
      pm.test("Reporta error en questionCount", () => pm.expect(pm.response.json().fieldErrors).to.have.property("questionCount"));
    language: text/javascript
order: 7000
