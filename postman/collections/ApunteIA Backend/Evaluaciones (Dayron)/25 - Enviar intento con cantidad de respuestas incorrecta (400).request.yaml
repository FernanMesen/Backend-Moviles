$kind: http-request
url: "{{baseUrl}}/attempts/{{evalAttemptId}}/submit"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "answers": [1]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 400", () => pm.response.to.have.status(400));
      pm.test("El mensaje menciona: Se esperaban 2 respuestas", () => pm.expect(pm.response.json().message).to.include("Se esperaban 2 respuestas"));
    language: text/javascript
order: 26000
