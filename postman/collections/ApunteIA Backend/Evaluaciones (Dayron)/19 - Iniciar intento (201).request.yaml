$kind: http-request
url: "{{baseUrl}}/assessments/{{evalAssessmentId}}/attempts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": {{evalUserId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 201", () => pm.response.to.have.status(201));
      const attempt = pm.response.json();
      pm.test("Responde con Location", () => pm.expect(pm.response.headers.get("Location")).to.include("/attempts/" + attempt.id));
      pm.test("Inicia en progreso y sin puntaje", () => { pm.expect(attempt.status).to.eql("IN_PROGRESS"); pm.expect(attempt.score).to.eql(null); pm.expect(attempt.completedAt).to.eql(null); pm.expect(attempt.answers).to.eql([]); });
      pm.collectionVariables.set("evalAttemptId", attempt.id);
    language: text/javascript
order: 19000
