$kind: http-request
url: "{{baseUrl}}/attempts/{{evalAttemptId}}/submit"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "answers": [1, 0]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 409", () => pm.response.to.have.status(409));
      pm.test("El mensaje menciona: ya fue completado", () => pm.expect(pm.response.json().message).to.include("ya fue completado"));
    language: text/javascript
order: 30000
