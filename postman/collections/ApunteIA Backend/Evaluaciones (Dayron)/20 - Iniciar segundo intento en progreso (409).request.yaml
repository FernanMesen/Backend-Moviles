$kind: http-request
url: "{{baseUrl}}/assessments/{{evalAssessmentId}}/attempts"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": {{evalUserId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code es 409", () => pm.response.to.have.status(409));
      pm.test("El mensaje menciona: ya tiene un intento en progreso", () => pm.expect(pm.response.json().message).to.include("ya tiene un intento en progreso"));
    language: text/javascript
order: 21000
