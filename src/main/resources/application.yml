spring:
  application:
    name: BackendApunteAI
  datasource:
    # H2 en archivo local: no hay que instalar nada para desarrollar
    url: jdbc:h2:file:./data/apunteia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true      # http://localhost:8080/h2-console (JDBC URL de arriba, usuario sa)
      path: /h2-console

server:
  port: 8080

app:
  ai:
    # La clave se configura localmente o en el entorno de despliegue; nunca se guarda en Git.
    api-key: ${AI_API_KEY:${OPENAI_API_KEY:}}
    model: ${AI_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  jwt:
    # En la nube SIEMPRE se define la variable JWT_SECRET (mínimo 32 caracteres).
    # El valor por defecto es solo para desarrollo local y pruebas.
    secret: ${JWT_SECRET:dev-only-apunteia-jwt-secret-cambiar-en-produccion-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: apunteia-backend
  password-reset:
    url: ${PASSWORD_RESET_URL:apunteia://reset-password}
  brevo:
    api-key: ${BREVO_API_KEY:}
    from-email: ${BREVO_FROM_EMAIL:}
    from-name: ${BREVO_FROM_NAME:ApunteIA}
