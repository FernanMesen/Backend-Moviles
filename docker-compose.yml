services:
  db:
    image: postgres:16-alpine
    container_name: apunteia-db
    environment:
      POSTGRES_DB: apunteia
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - apunteia-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d apunteia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: apunteia-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/apunteia
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AI_API_KEY: "${AI_API_KEY:-${OPENAI_API_KEY:-}}"
      AI_MODEL: "${AI_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      JWT_SECRET: ${JWT_SECRET:-dev-only-apunteia-jwt-secret-cambiar-en-produccion-0123456789}
    ports:
      - "8080:8080"

volumes:
  apunteia-data:
